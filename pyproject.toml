[project]
name = "damo_afvoergebiedaanvoergebied"
version = "0.1.0"
description = "Python toolbox om afwateringseenheden te genereren op basis van basisdata en een raster"
authors = [{ name = "Harm Nomden", email = "harm.nomden@sweco.nl" }]
requires-python = "==3.11.*"
dependencies = ["hydrolib==0.5.0", "hkvsobekpy>=1.5,<2"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
damo_afvoergebiedaanvoergebied = { path = ".", editable = true }

[tool.pixi.dependencies]
# Jupyter
ipykernel = ">=7.2.0,<8"
ipywidgets = ">=8.1.8,<9"

# PROJ
pyogrio = ">=0.9.0,<0.10.0"
gdal = "*"
proj = "*"
pyproj = "*"
fire = "*"

# Core
pandas = ">=1.2,<3.0"
xarray = "*"
pydantic = "*"

# GIS vector
geopandas = ">=1.1.3,<2"
shapely = "*"
fiona = ">=1.10.1,<2"

# Core GIS
rasterio = ">=1.4.2,<1.5"
rioxarray = ">=0.19.0,<0.20"
geocube = "*"

# Hydrology
pyflwdir = ">=0.5.11,<0.6"
rasterstats = ">=0.21.0,<0.22"
imod = ">=1.0.0.post1,<2"
networkx = ">=3.6.1,<4"
xugrid = ">=0.15.2,<0.16"
momepy = ">=0.11.0,<0.12"
xarray-spatial = ">=0.5.3,<0.6"

# Utils
matplotlib = ">=3.10.9,<4"
numba = ">=0.65.1,<0.66"
python-dotenv = ">=1.2.2,<2"
toml = ">=0.10.2,<0.11"
tomli = ">=2.4.1,<3"
importlib_resources = ">=7.1.0,<8"

# IO
netcdf4 = ">=1.7.2,<2"
h5netcdf = ">=1.8.1,<2"
openpyxl = ">=3.1.5,<4"
xlsxwriter = ">=3.2.9,<4"
